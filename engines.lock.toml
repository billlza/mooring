# SPDX-License-Identifier: GPL-3.0-or-later
#
# Pinned inputs for the Go engines (design §4). Integrity values here are
# Level 1: they detect an accidental wrong or corrupted artifact, not a
# malicious one. The engines are built on a hosted runner
# (.github/workflows/engines.yml), never on the exit Mac (design D-7). While
# no output digests are recorded, `cargo xtask engines-verify` prints those
# of the first reproducible hosted build for review and pinning; it checks
# every later build against them. An empty table means the artifacts have
# not been built from these inputs yet.

schema = 1

[go]
# go1.27.3, the security release of 2026-10-19: go1.27.2 lacks the fix for
# GO-2026-6809 (crypto/x509 distrusts compromised intermediates, published
# 2026-10-21, affects 1.27.0 up to 1.27.3; read at vuln.go.dev). Checked on
# 2026-10-23: both values equal https://go.dev/dl/?mode=json&include=all and
# the .sha256 files at https://dl.google.com/go/.
version = "go1.27.3"
darwin-arm64-sha256 = "dd3908cf20959d798c1e06ebe5b72213f0505ce01373b40ce3110975a6cd99c2"
linux-amd64-sha256 = "65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40"
env = { GOTOOLCHAIN = "local", CGO_ENABLED = "0", GOFLAGS = "-mod=readonly -trimpath" }

[govulncheck]
# Installed by the hosted build with `go install`, which checks it against
# the checksum database; the sum is sum.golang.org's (2026-10-23). v1.8.0
# (2026-09-08) rather than v1.9.0, which was 12 days old.
module = "golang.org/x/vuln"
version = "v1.8.0"
sum = "h1:clG4qBU6zH5VKjti8n5j8BBuYzoSha392xXMkXS351U="

[xray]
module = "github.com/xtls/xray-core"
tag = "v26.9.30"
commit = "b26a91de4f3294e26a0ad0a970b81a386a41f789"
prerelease = true
# User decision D-3 (design §4.2): replace the REALITY library pinned by
# v26.9.30 (8cdf7bf9, mandatory hybrid key share) with its parent e1986a4,
# which accepts classical and hybrid clients and carries the #36 and #33 fixes.
upstream-reality = "github.com/xtls/reality v0.0.0-20260908062103-8cdf7bf9c7f0"
reality-replace = "github.com/xtls/reality v0.0.0-20260908045812-e1986a4d31ca"
reality-replace-commit = "e1986a4d31ca33c087a72ab4644aef1295693b69"
ldflags = "-X github.com/xtls/xray-core/core.build=v26.9.30 -s -w -buildid="
gcflags = "all=-l=4"
targets = ["linux-amd64", "linux-arm64"]
# The go.mod and go.sum change the replace makes, so that the build runs
# with -mod=readonly (design §4.4). `cargo xtask engines-prepare` writes it
# on the hosted runner; it is reviewed, committed here and pinned. Reviewed
# 2026-10-23 (hosted run 39906955840): one replace line and the two go.sum
# lines of the replacement, equal to sum.golang.org's; the pseudo-version is
# commit e1986a4d31ca33c0 (proxy.golang.org .info), 8cdf7bf9's parent.
patch = "engines/patches/xray-reality-e1986a4.patch"
patch-sha256 = "0b48048d41016fb4526d9e9594619aa1dbc6c3c4226378962fc7d6351e56ebb8"

# "<target>" = "<sha256 of the unsigned binary>", filled from the first
# reproducible hosted build and checked by `cargo xtask engines-verify`.
[xray.outputs]

[sing-box]
module = "github.com/sagernet/sing-box"
tag = "v1.14.2"
commit = "af6e64c3b69e6132ebaee0e1a3d24e93903f6709"
prerelease = false
ldflags = "-X 'github.com/sagernet/sing-box/constant.Version=1.14.2' -X runtime.godebugDefault=multipathtcp=0,tlssha1=1 -checklinkname=0 -s -w -buildid="
common-tags = ["badlinkname", "tfogo_checklinkname0"]

[sing-box.roles.mooring-exit]
targets = ["darwin-arm64"]
tags = ["with_gvisor", "with_wireguard"]

[sing-box.roles.mooring-probe]
targets = ["darwin-arm64"]
tags = ["with_quic", "with_utls"]

[sing-box.roles.mooring-hy2]
targets = ["linux-amd64", "linux-arm64"]
tags = ["with_quic"]

# "<role>/<target>" = "<sha256 of the unsigned binary>".
[sing-box.outputs]

[geodata]
source = "Xray-linux-64.zip from the XTLS/Xray-core v26.9.30 release"
zip-url = "https://github.com/XTLS/Xray-core/releases/download/v26.9.30/Xray-linux-64.zip"
# Upstream's Xray-linux-64.zip.dgst (SHA2-256), read 2026-10-23; the hosted
# build checks its own download against it.
zip-sha256 = "f851110beaff16e78d643f0ccfd9524b4a44dfd59bae3e34bb52bba378f7690e"
files = ["geoip.dat", "geosite.dat"]

# "<file>" = "<sha256>", from the first hosted build.
[geodata.outputs]
