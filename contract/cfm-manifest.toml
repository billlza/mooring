#
# The CFM revisions Mooring's export contract is checked against (design
# §9.3 items 1, 2 and 4). `cargo xtask acceptance` reads this file into
# typed serde structs that deny unknown keys (xtask/src/acceptance/
# manifest.rs) and checks each importer_digest, that no patch is listed
# twice, and that the [cfm.<client line>] tables are exactly the client
# lines `mooring_export::shapes()` enumerates. `line` is the CFM release
# line ("major.minor") and `sing_box_tag` a sing-box release tag
# ("vX.Y.Z"). The release gate (`cargo xtask release-acceptance`) takes
# each line's importer_digest, release line and sing-box tag from here.
# The planned `xtask cfm-client` reads it to build upstream and CFM-patched
# sing-box CLI clients; docs/cfm-contract.md cites the importer source at
# exactly these revisions.
#
# Values were read on 2026-10-08 from the local CFM checkouts, read-only:
#   cfm04: /Users/bill/cfw-rs at ac981c3 (the importer files and the six
#          1.14.1 patches are unmodified in its working tree, except
#          sing-box-v1.14.1-socks-lifecycle.patch, which carries uncommitted
#          edits; the hash below is the committed blob).
#   cfm05: /Users/bill/cfw-rs-liquid-glass-dialogs at 3157ef9 (clean
#          working tree; design §21 cites f340fae, an ancestor). The
#          `support_x25519mlkem768` opt-in is committed there (e6c9e05).
#
# importer_digest: SHA-256 (`shasum -a 256`) of these three lines, in this
# order, each "<path> <git object id at the revision>" ending in "\n":
#   apps/cfw-tauri-shell/src/subscription_import     (tree)
#   apps/cfw-tauri-shell/src/subscription_import.rs  (blob)
#   crates/cfw-singbox-config                        (tree)
# `cargo xtask acceptance` recomputes it from [cfm.<line>.importer]. Any
# change to CFM's importer changes it and invalidates the accepted entries
# of contract/cfm-acceptance.toml for that line.
#
# patch sha256: `git show <revision>:<path> | shasum -a 256`; each equals
# the value CFM pins in scripts/dependency_pins.env at the revision. The
# patches are listed in the order CFM applies them
# (scripts/libbox_source_contract.sh:437-443 at both revisions:
# `git apply --whitespace=error-all --unidiff-zero`).

