# SPDX-License-Identifier: GPL-3.0-or-later
#
# CFM import acceptance of every export shape (design §9.3 item 2, §16 L7).
#
# One [[shape]] entry per (shape hash, client line) that
# `mooring_export::shapes()` enumerates. `cargo xtask acceptance`, a step of
# `cargo xtask ci`, fails when an enumerated shape has no entry, an entry is
# stale, or two entries record the same hash for the same client line
# (`require_recorded` in xtask/src/acceptance/file.rs). A shape's name and
# hash change whenever the emitter's keys, key order, constants or leaf
# domains change.
#
# Every entry has name, client_line, hash and status, and status decides
# the other keys:
#   pending-real-cfm-import  no real CFM import has run yet (M6). No other
#                            key. Pending counts as recorded for CI, never
#                            as accepted.
#   accepted                 imported into real CFM and connected. Requires
#                            exactly these other keys: importer_digest,
#                            export_sha256 and evidence_sha256 (64 lowercase
#                            hex), cfm_build (a positive integer),
#                            bundle_version and sing_box_core ("x.y.z"),
#                            import_date (a TOML local date such as
#                            2026-10-20) and connect = "connected".
#
# The release gate, `cargo xtask release-acceptance` (`require_accepted`;
# release verification runs it, ci does not), requires every entry to be
# accepted against the line's current importer digest in
# contract/cfm-manifest.toml, by a CFM build of that line: bundle_version
# in the line's release line (`line`) and sing_box_core equal to its
# `sing_box_tag` without the "v". It fails until M6 accepts every shape.
#
# Format: TOML, read into typed serde structs that deny unknown keys.

