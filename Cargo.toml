# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
members = [
  "crates/model",
  "crates/keys",
  "crates/export",
  "crates/agent-proto",
  "crates/render",
  "crates/store",
  "crates/fixtures",
  "crates/daemon-core",
  "crates/macsys",
  "crates/mooringctl",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["bill"]
rust-version = "1.98"
publish = false

# Release profile for the shipped binaries (mooringctl on macOS, mooring-agent on
# Linux musl): maximum optimisation and stripped symbols. panic=unwind is kept so
# typed errors and Drop-based cleanup (zeroize) still run on unexpected panics.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "deny"
unused_qualifications = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
# Internal crates. The permitted edges are asserted by `cargo xtask graph-check`.
mooring-model = { path = "crates/model" }
mooring-keys = { path = "crates/keys" }
mooring-export = { path = "crates/export" }
mooring-agent-proto = { path = "crates/agent-proto" }
mooring-render = { path = "crates/render" }
mooring-store = { path = "crates/store" }
mooring-fixtures = { path = "crates/fixtures" }
mooring-daemon-core = { path = "crates/daemon-core" }
mooring-macsys = { path = "crates/macsys" }

# One generation of each crypto/encoding crate (deny.toml multiple-versions = "deny").
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "fast", "zeroize"] }
getrandom = { version = "0.4.3", default-features = false, features = ["std"] }
ipnet = { version = "2.12.2", features = ["serde"] }
# P-256 self-signed Hysteria2 certificate (ring backend: C and assembly, no C++).
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "x509-parser"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
uuid = "1.27.0"
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
x509-parser = "0.18.1"
zeroize = { version = "1.9.1", features = ["derive"] }

# Revision 7, checked on crates.io on 2026-10-13: each is the newest stable
# release at least 14 days old.
# mooringctl only: typed subcommands, so no secret is ever an argument. No
# colour and no suggestions, so no terminal-detection crates.
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# macsys only: sysctl, if_nametoindex, termios. Held at 0.2.189 in the lock:
# 0.2.190 was published on 2026-10-02.
libc = "0.2.189"
# mooringctl only: the legacy login keychain (SecItem generic passwords).
# The default features only raise the minimum macOS and TLS versions.
security-framework = { version = "3.7.0", default-features = false }
# mooringctl only: the `CFData` that security-framework's item add and update
# take, so `set-password` can replace an item whatever its label (its
# password helper searches by the label too). Already in the graph as
# security-framework's own dependency, at the same version and features.
core-foundation = "0.10.1"
# mooringctl only: `all` provides bind_device_by_index_v4 (IP_BOUND_IF) on
# macOS, which binds the router client to the M7's interface.
socket2 = { version = "0.6.5", features = ["all"] }

# xtask only: reads deny.toml and the contract/*.toml files into serde types.
# 1.1.6 is the newest release at least 14 days old (1.1.7 was published on
# 2026-10-08); parse + serde is all deserialising needs.
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde"] }

# Development and test only.
insta = { version = "1.49.0", features = ["json"] }
proptest = "1.11.0"
saphyr = "0.1.0"
tempfile = "3.27.0"
